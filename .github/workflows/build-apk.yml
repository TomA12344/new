name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test navigation alert sequences
        run: |
          mkdir -p /tmp/mibandmaps-tests
          javac -d /tmp/mibandmaps-tests app/src/main/java/com/tom/mibandmaps/NavigationGate.java tests/NavigationGateTest.java
          java -cp /tmp/mibandmaps-tests com.tom.mibandmaps.NavigationGateTest

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mibandmaps-debug-signing-v1

      - name: Prepare cached debug signing key
        run: |
          keystore_path="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$keystore_path" ]; then
            keytool -genkeypair -noprompt -storetype JKS \
              -keystore "$keystore_path" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "MIBANDMAPS_DEBUG_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"
          keytool -list -keystore "$keystore_path" -storepass android -alias androiddebugkey

      - name: Install Android command line tools
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-cmdline/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

      - name: Install Android 16 SDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Show package metadata
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: MiBandMaps-Android16
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
